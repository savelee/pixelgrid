version: '3.8'

services:
  pixelgrid:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pixelgrid-service
    restart: unless-stopped
    # Host networking & D-Bus mount are required for Linux BLE / BlueZ access on Raspberry Pi
    network_mode: "host"
    privileged: true
    volumes:
      - ./downloads:/app/downloads
      - /var/run/dbus:/var/run/dbus
      - /run/dbus:/run/dbus
      - /sys/class/bluetooth:/sys/class/bluetooth
    environment:
      # Option 1: Use Google AI Studio free API Key (personal account)
      # - GEMINI_API_KEY=AIzaSyYourApiKeyHere
      # Option 2: Use Google Cloud Vertex AI (requires ADC credentials)
      - GCP_PROJECT_ID=leeboonstra
      - GEMINI_LOCATION=global
      - GEMINI_MODEL=gemini-3.5-flash
      - PYTHONPATH=/app
      - PORT=8080
      - LOOP_INTERVAL_MINUTES=15
      # Set your Divoom speaker MAC address or UUID:
      # - DIVOOM_MAC_ADDRESS=6B3A1398-627A-47C9-FFCD-1A81B7769567
