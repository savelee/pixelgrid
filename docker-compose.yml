version: '3.8'

services:
  pixelgrid:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pixelgrid-service
    restart: unless-stopped
    # Host networking & D-Bus mount are required for Linux BLE / BlueZ access on Raspberry Pi
    network_mode: "host"
    privileged: true
    volumes:
      - ./downloads:/app/downloads
      - /var/run/dbus:/var/run/dbus
      - /run/dbus:/run/dbus
      - /sys/class/bluetooth:/sys/class/bluetooth
    env_file:
      - .env
    environment:
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-leeboonstra}
      - GEMINI_LOCATION=${GEMINI_LOCATION:-global}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
      - PYTHONPATH=/app
      - PORT=8080
      - LOOP_INTERVAL_MINUTES=10
      - GRID_SIZE=8
      - DIVOOM_MAC_ADDRESS=${DIVOOM_MAC_ADDRESS}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
