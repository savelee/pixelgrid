[project]
name = "pixelgrid"
version = "0.1.0"
description = "Retro 16x16 pixel art generator powered by Vertex AI Gemini and Divoom Timebox Evo BLE display"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=0.1.0",
    "divoom-protocol>=0.2.0",
    "bleak>=0.21.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-aiohttp>=1.0.5",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

